<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pedido Completo - Restaurante</title>
    <style>
        :root { --primary: #e67e22; --secondary: #27ae60; --bg: #f8f9fa; }
        body { font-family: 'Segoe UI', sans-serif; background-color: var(--bg); padding: 15px; }
        .container { max-width: 480px; background: white; padding: 25px; border-radius: 20px; margin: auto; box-shadow: 0 10px 25px rgba(0,0,0,0.1); }
        h2 { color: var(--primary); text-align: center; margin-bottom: 5px; }
        .section { margin-bottom: 20px; padding: 15px; border: 1px solid #f1f1f1; border-radius: 12px; background: #fff; }
        label { display: block; margin-bottom: 8px; font-weight: bold; font-size: 0.9em; color: #444; }
        select, input[type="text"], textarea { width: 100%; padding: 12px; border: 1px solid #ddd; border-radius: 8px; box-sizing: border-box; font-size: 15px; }
        
        /* Estilo para los adicionales (Checkboxes) */
        .extra-item { display: flex; align-items: center; justify-content: flex-start; gap: 10px; padding: 8px 0; border-bottom: 1px dashed #eee; cursor: pointer; }
        .extra-item:last-child { border-bottom: none; }
        .extra-item input { width: 18px; height: 18px; cursor: pointer; }
        .price { margin-left: auto; color: #27ae60; font-weight: bold; font-size: 0.85em; }

        .btn-order { width: 100%; background: var(--secondary); color: white; border: none; padding: 18px; font-size: 18px; font-weight: bold; border-radius: 12px; cursor: pointer; transition: 0.3s; margin-top: 10px; }
        .btn-order:hover { background: #219150; transform: scale(1.02); }
    </style>
</head>
<body onload="inicializarApp()">

<div class="container">
    <h2>🍴 Pedido El Buen Gusto</h2>
    <div style="text-align: center; margin-bottom: 15px;"><span id="fechaHoy" style="color: #888; font-size: 0.9em;"></span></div>
    
    <form id="orderForm">
        <div class="section">
            <label>🍲 Plato del Día (Selecciona el día):</label>
            <select id="diaSemana" onchange="actualizarMenu()" style="margin-bottom: 10px; background: #fffceb;">
                <option value="Lunes">Lunes</option>
                <option value="Martes">Martes</option>
                <option value="Miércoles">Miércoles</option>
                <option value="Jueves">Jueves</option>
                <option value="Viernes">Viernes</option>
                <option value="Sábado">Sábado</option>
            </select>
            <select id="platoSeleccionado" required></select>
        </div>

        <div class="section">
            <label>➕ ¿Deseas algún adicional?</label>
            <div class="extra-item">
                <input type="checkbox" name="adicional" value="Porción de Aguacate" data-precio="2000"> 
                <span>Porción de Aguacate</span>
                <span class="price">+$2.000</span>
            </div>
            <div class="extra-item">
                <input type="checkbox" name="adicional" value="Huevo Frito" data-precio="1500"> 
                <span>Huevo Frito</span>
                <span class="price">+$1.500</span>
            </div>
            <div class="extra-item">
                <input type="checkbox" name="adicional" value="Tajada de Maduro" data-precio="1000"> 
                <span>Tajada de Maduro</span>
                <span class="price">+$1.000</span>
            </div>
            <div class="extra-item">
                <input type="checkbox" name="adicional" value="Postre del Día" data-precio="3000"> 
                <span>Postre del Día</span>
                <span class="price">+$3.000</span>
            </div>
        </div>

        <div class="section">
            <label>🥤 Elige tu Bebida:</label>
            <select id="bebida">
                <option value="Jugo Natural (Incluido)">Jugo Natural (Incluido)</option>
                <option value="Limonada Cerezada (+2500)">Limonada Cerezada (+$2.500)</option>
                <option value="Gaseosa 350ml (+3000)">Gaseosa 350ml (+$3.000)</option>
                <option value="Sin Bebida">Sin Bebida</option>
            </select>
        </div>

        <div class="section">
            <label>👤 Datos de Entrega:</label>
            <input type="text" id="nombre" placeholder="Tu nombre" required style="margin-bottom: 10px;">
            <input type="text" id="direccion" placeholder="Dirección y Barrio" required>
            <textarea id="notas" rows="2" placeholder="Notas: Ej. El timbre no sirve..." style="margin-top: 10px;"></textarea>
        </div>

        <button type="button" class="btn-order" onclick="enviarWhatsApp()">✅ Enviar Pedido por WhatsApp</button>
    </form>
</div>

<script>
    const menus = {
        "Lunes": ["Lentejas con Chorizo", "Pollo al Horno"],
        "Martes": ["Carne en Bistec", "Filete de Pescado"],
        "Miércoles": ["Ajiaco Santafereño", "Cerdo Apanado"],
        "Jueves": ["Sancocho", "Arroz con Pollo"],
        "Viernes": ["Bandeja Paisa", "Sobrebarriga"],
        "Sábado": ["Especial Parrilla", "Mondongo"]
    };

    function inicializarApp() {
        const hoy = new Date();
        const dias = ["Domingo", "Lunes", "Martes", "Miércoles", "Jueves", "Viernes", "Sábado"];
        const nombreDia = dias[hoy.getDay()];
        
        document.getElementById('fechaHoy').innerText = `Hoy es ${nombreDia} ${hoy.getDate()}/${hoy.getMonth()+1}`;
        
        const selectDia = document.getElementById('diaSemana');
        if(hoy.getDay() !== 0) selectDia.value = nombreDia;
        
        actualizarMenu();
    }

    function actualizarMenu() {
        const dia = document.getElementById('diaSemana').value;
        const selectPlato = document.getElementById('platoSeleccionado');
        selectPlato.innerHTML = '';
        menus[dia].forEach(plato => {
            let opt = document.createElement('option');
            opt.value = plato; opt.text = plato;
            selectPlato.appendChild(opt);
        });
    }

    function enviarWhatsApp() {
        const telefono = "573143996019"; // CAMBIA TU NÚMERO
        const dia = document.getElementById('diaSemana').value;
        const plato = document.getElementById('platoSeleccionado').value;
        const bebida = document.getElementById('bebida').value;
        const nombre = document.getElementById('nombre').value;
        const direccion = document.getElementById('direccion').value;
        const notas = document.getElementById('notas').value || "Ninguna";

        // Obtener adicionales seleccionados
        let adicionales = [];
        document.querySelectorAll('input[name="adicional"]:checked').forEach(item => {
            adicionales.push(item.value);
        });
        let textoAdicionales = adicionales.length > 0 ? adicionales.join(", ") : "Ninguno";

        if (!nombre || !direccion) {
            alert("Completa nombre y dirección");
            return;
        }

        const mensaje = `*NUEVO PEDIDO - ${dia.toUpperCase()}*%0A` +
                        `--------------------------%0A` +
                        `*Cliente:* ${nombre}%0A` +
                        `*Plato:* ${plato}%0A` +
                        `*Adicionales:* ${textoAdicionales}%0A` +
                        `*Bebida:* ${bebida}%0A` +
                        `*Dirección:* ${direccion}%0A` +
                        `*Notas:* ${notas}%0A` +
                        `--------------------------`;

        window.open(`https://wa.me/${telefono}?text=${mensaje}`, '_blank');
    }
</script>

</body>
</html>
