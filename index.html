<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pedido Express - Menú Semanal</title>
    <style>
        :root { --primary: #e67e22; --whatsapp: #25d366; --bg: #fdfefe; }
        body { font-family: 'Segoe UI', sans-serif; background-color: var(--bg); padding: 15px; color: #2c3e50; }
        .container { max-width: 480px; background: white; padding: 25px; border-radius: 20px; margin: auto; box-shadow: 0 10px 30px rgba(0,0,0,0.1); }
        h2 { color: var(--primary); text-align: center; margin-bottom: 5px; }
        .badge { background: #fff3e0; color: #e65100; padding: 5px 12px; border-radius: 15px; font-size: 0.8em; font-weight: bold; }
        .section { margin-bottom: 20px; padding: 15px; background: #fafafa; border-radius: 12px; }
        label { display: block; margin-bottom: 8px; font-weight: bold; font-size: 0.9em; }
        select, input, textarea { width: 100%; padding: 12px; border: 1px solid #ddd; border-radius: 8px; box-sizing: border-box; font-size: 15px; margin-bottom: 10px; }
        .extra-item { display: flex; align-items: center; gap: 10px; padding: 5px 0; border-bottom: 1px solid #eee; font-size: 0.9em; }
        .btn-order { width: 100%; background: var(--whatsapp); color: white; border: none; padding: 18px; font-size: 18px; font-weight: bold; border-radius: 12px; cursor: pointer; transition: 0.3s; }
        .btn-order:hover { background: #1ebd5a; transform: translateY(-2px); }
        .remember-me { font-size: 0.85em; display: flex; align-items: center; gap: 8px; color: #666; cursor: pointer; }
        .remember-me input { width: auto; margin: 0; }
    </style>
</head>
<body onload="inicializarApp()">

<div class="container">
    <h2>🍽️ Pedido El Sabor</h2>
    <div style="text-align: center; margin-bottom: 15px;"><span id="fechaHoy" class="badge"></span></div>
    
    <form id="orderForm">
        <div class="section">
            <label>📅 Día:</label>
            <select id="diaSemana" onchange="actualizarMenu()" style="background: #fff9c4;">
                <option value="Lunes">Lunes</option>
                <option value="Martes">Martes</option>
                <option value="Miércoles">Miércoles</option>
                <option value="Jueves">Jueves</option>
                <option value="Viernes">Viernes</option>
                <option value="Sábado">Sábado</option>
            </select>
            <label>🍲 Plato Principal:</label>
            <select id="platoSeleccionado"></select>
        </div>

        <div class="section">
            <label>➕ Adicionales:</label>
            <div class="extra-item"><input type="checkbox" name="extra" value="Aguacate"> Aguacate (+$2.000)</div>
            <div class="extra-item"><input type="checkbox" name="extra" value="Huevo"> Huevo (+$1.500)</div>
            
            <label style="margin-top:15px;">🥤 Bebida:</label>
            <select id="bebida">
                <option value="Jugo del día">Jugo del día (Incluido)</option>
                <option value="Limonada (+2.500)">Limonada (+$2.500)</option>
                <option value="Gaseosa (+3.000)">Gaseosa (+$3.000)</option>
            </select>
        </div>

        <div class="section">
            <label>👤 Datos de Entrega:</label>
            <input type="text" id="nombre" placeholder="Tu Nombre" required>
            <input type="text" id="direccion" placeholder="Dirección y Barrio" required>
            <label class="remember-me">
                <input type="checkbox" id="recordarDatos" checked> Recordar mis datos en este dispositivo
            </label>
            <textarea id="notas" rows="2" placeholder="Instrucciones adicionales..."></textarea>
        </div>

        <button type="button" class="btn-order" onclick="enviarWhatsApp()">✅ Enviar a WhatsApp</button>
    </form>
</div>

<script>
    const menus = {
        "Lunes": ["Frijolada", "Pollo al Curry", "Pollo Sudado"],
        "Martes": ["Carne Asada", "Pescado Frito"],
        "Miércoles": ["Ajiaco", "Lomo de Cerdo"],
        "Jueves": ["Sancocho", "Arroz con Pollo"],
        "Viernes": ["Bandeja Paisa", "Sobrebarriga"],
        "Sábado": ["Sancocho de Gallina", "Parrillada"]
    };

    function inicializarApp() {
        // 1. Detectar fecha
        const hoy = new Date();
        const dias = ["Domingo", "Lunes", "Martes", "Miércoles", "Jueves", "Viernes", "Sábado"];
        const nombreDia = dias[hoy.getDay()];
        document.getElementById('fechaHoy').innerText = `Hoy es ${nombreDia}, ${hoy.getDate()}/${hoy.getMonth()+1}`;
        
        const selectDia = document.getElementById('diaSemana');
        if(hoy.getDay() !== 0) selectDia.value = nombreDia;
        actualizarMenu();

        // 2. Cargar datos recordados
        if (localStorage.getItem('nombre')) {
            document.getElementById('nombre').value = localStorage.getItem('nombre');
            document.getElementById('direccion').value = localStorage.getItem('direccion');
        }
    }

    function actualizarMenu() {
        const dia = document.getElementById('diaSemana').value;
        const selectPlato = document.getElementById('platoSeleccionado');
        selectPlato.innerHTML = '';
        menus[dia].forEach(p => {
            let opt = document.createElement('option');
            opt.value = p; opt.text = p;
            selectPlato.appendChild(opt);
        });
    }

    function enviarWhatsApp() {
        const nombre = document.getElementById('nombre').value;
        const direccion = document.getElementById('direccion').value;

        if (!nombre || !direccion) {
            alert("Por favor completa tus datos.");
            return;
        }

        // Guardar datos si el check está activo
        if (document.getElementById('recordarDatos').checked) {
            localStorage.setItem('nombre', nombre);
            localStorage.setItem('direccion', direccion);
        } else {
            localStorage.removeItem('nombre');
            localStorage.removeItem('direccion');
        }

        const dia = document.getElementById('diaSemana').value;
        const plato = document.getElementById('platoSeleccionado').value;
        const bebida = document.getElementById('bebida').value;
        let extras = [];
        document.querySelectorAll('input[name="extra"]:checked').forEach(e => extras.push(e.value));
        
        const msg = `*NUEVO PEDIDO (${dia.toUpperCase()})*%0A` +
                    `--------------------------%0A` +
                    `*Cliente:* ${nombre}%0A` +
                    `*Plato:* ${plato}%0A` +
                    `*Adicionales:* ${extras.length > 0 ? extras.join(", ") : "Ninguno"}%0A` +
                    `*Bebida:* ${bebida}%0A` +
                    `*Dirección:* ${direccion}%0A` +
                    `--------------------------`;

        window.open(`https://wa.me/573143996019?text=${msg}`, '_blank');
    }
</script>

</body>
</html>
